<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Papyrus · 个人书籍管理系统</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <!-- 顶部导航栏 -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand" id="nav-shelf">
        <span class="brand-icon">📚</span>
        <span class="brand-name">Papyrus</span>
        <span class="brand-sub">个人书斋</span>
      </div>
      <nav class="nav-tabs">
        <button class="nav-tab active" data-view="shelf">书架</button>
        <button class="nav-tab" data-view="lendings">借阅记录</button>
        <button class="nav-tab" data-view="tags">标签</button>
        <button class="nav-tab" data-view="categories">分类</button>
      </nav>
      <div class="header-actions">
        <button class="btn btn-primary" id="btn-add-book">＋ 添加书籍</button>
      </div>
    </div>
  </header>

  <!-- 主内容区 -->
  <main id="app" class="app-main">
    <!-- 各视图由 TS 动态渲染 -->
  </main>

  <!-- 弹窗容器 -->
  <div id="modal-root"></div>

  <!-- 消息提示容器 -->
  <div id="toast-root" class="toast-root"></div>

  <script src="/app.js"></script>
</body>
</html>
